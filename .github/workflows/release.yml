name: Desktop download
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run pack:desktop
      - run: npm run pack:game
      - run: cd release/xiaohongshu-game && zip -r ../wild-window-xiaohongshu.zip .
      - run: cd release && zip -r wild-window-desktop.zip wild-window
      - uses: actions/upload-artifact@v4
        with:
          name: wild-window-desktop
          path: |
            release/wild-window-desktop.zip
            release/wild-window-xiaohongshu.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/wild-window-desktop.zip release/wild-window-xiaohongshu.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/wild-window-desktop.zip release/wild-window-xiaohongshu.zip --title "Global Wildlife Monitor $GITHUB_REF_NAME" --notes "下载 ZIP 并解压，安装 Node.js 22.13 或更新版本后，双击对应系统启动文件。"
          fi
